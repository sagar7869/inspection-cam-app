<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>InspectCam Pro</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#030712" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
  <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
  <style>
    body { height: 100dvh; overflow: hidden; }
  </style>
</head>
<body class="bg-gray-950 text-white flex flex-col justify-between select-none">

  <!-- Top Header -->
  <header class="px-4 py-2.5 bg-gray-900 border-b border-gray-800 flex justify-between items-center shrink-0">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>
      <h1 class="font-bold text-base tracking-wide text-white">InspectCam</h1>
    </div>
    <div class="flex items-center gap-2">
      <button id="stopCamBtn" onclick="stopCamera()" class="hidden text-xs bg-gray-800 text-gray-300 px-2.5 py-1.5 rounded-lg border border-gray-700">
        Close Cam
      </button>
      <button onclick="clearAllClips()" class="text-xs bg-red-950 text-red-300 px-2.5 py-1.5 rounded-lg border border-red-800/70">
        Clear All
      </button>
    </div>
  </header>

  <!-- Center Camera Viewport -->
  <main class="relative flex-1 bg-black flex flex-col items-center justify-center overflow-hidden">
    
    <!-- Camera Off Placeholder Screen -->
    <div id="cameraPlaceholder" class="flex flex-col items-center justify-center p-6 text-center space-y-4">
      <div class="w-20 h-20 rounded-full bg-gray-900 border border-gray-800 flex items-center justify-center text-4xl shadow-inner">
        📷
      </div>
      <div>
        <h2 class="text-lg font-semibold text-gray-100">Camera is Standby</h2>
        <p class="text-xs text-gray-400 mt-1 max-w-xs">Tap below to start the main rear camera for inspection.</p>
      </div>
      <button onclick="startCamera()" class="bg-blue-600 hover:bg-blue-500 active:scale-95 transition text-white font-semibold px-6 py-3 rounded-full shadow-lg shadow-blue-600/30">
        Open Camera
      </button>
    </div>

    <!-- Live Video Stream -->
    <video id="cameraPreview" autoplay playsinline muted class="hidden w-full h-full object-cover"></video>

    <!-- Recording Timer Badge -->
    <div id="recBadge" class="hidden absolute top-4 left-4 bg-red-600/90 backdrop-blur text-white text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow">
      <span class="w-2 h-2 bg-white rounded-full animate-ping"></span>
      <span id="recTimer">00:00</span>
    </div>

    <!-- Active Camera Controls Overlay -->
    <div id="cameraControls" class="hidden absolute bottom-4 inset-x-0 flex flex-col items-center gap-3 px-4">
      
      <!-- Mode Switcher (Video / Photo) -->
      <div id="modeSwitcher" class="bg-gray-900/85 backdrop-blur-md p-1 rounded-full border border-gray-700/80 flex text-xs font-semibold">
        <button id="tabVideo" onclick="switchMode('video')" class="px-4 py-1.5 rounded-full bg-blue-600 text-white transition">
          Video
        </button>
        <button id="tabPhoto" onclick="switchMode('photo')" class="px-4 py-1.5 rounded-full text-gray-300 transition">
          Photo
        </button>
      </div>

      <!-- Shutter / Record Action Button -->
      <div class="flex items-center justify-center">
        <!-- Video Action -->
        <button id="videoActionBtn" onclick="toggleVideoRecording()" class="h-16 px-7 rounded-full bg-red-600 text-white font-bold shadow-xl border-4 border-white/20 active:scale-95 transition flex items-center gap-2">
          <span class="w-3.5 h-3.5 rounded-full bg-white"></span>
          <span>Start Rec</span>
        </button>

        <!-- Photo Action -->
        <button id="photoActionBtn" onclick="capturePhoto()" class="hidden w-16 h-16 rounded-full bg-white text-gray-900 shadow-xl border-4 border-gray-400 active:scale-90 transition flex items-center justify-center text-2xl">
          📸
        </button>
      </div>
    </div>
  </main>

  <!-- Bottom Thumbnail Queue & Export Trigger -->
  <footer class="bg-gray-900 border-t border-gray-800 p-3 space-y-2.5 shrink-0">
    <div class="flex justify-between items-center text-[11px] text-gray-400 px-1">
      <span id="clipCountLabel">Captured Items (0)</span>
      <span>Auto-saved offline</span>
    </div>

    <!-- Horizontal Thumbnail Strip -->
    <div id="thumbnailList" class="flex gap-2.5 overflow-x-auto pb-1 min-h-[72px] items-center">
      <p class="text-gray-500 text-xs mx-auto">No clips or photos saved yet.</p>
    </div>

    <!-- Open Export Modal Button -->
    <button onclick="openExportModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] text-white font-bold py-3 rounded-xl shadow-lg transition text-sm">
      Proceed to Export & Share →
    </button>
  </footer>

  <!-- EXPORT & SHARE MODAL -->
  <div id="exportModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-3">
    <div class="bg-gray-900 border border-gray-800 w-full max-w-md rounded-2xl p-5 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-gray-800 pb-3">
        <h3 class="font-bold text-base text-white">Export Inspection Video</h3>
        <button onclick="closeExportModal()" class="text-gray-400 hover:text-white text-xl leading-none">&times;</button>
      </div>

      <!-- Custom File Name Input -->
      <div class="space-y-1">
        <label class="text-xs text-gray-400 font-medium">File Name</label>
        <div class="flex items-center bg-gray-800 border border-gray-700 rounded-xl px-3 py-2.5">
          <input id="fileNameInput" type="text" placeholder="e.g. Motor_Unit_04" class="bg-transparent text-sm text-white w-full outline-none" />
          <span class="text-xs text-gray-400 font-mono">.mp4</span>
        </div>
      </div>

      <!-- Quality Selection -->
      <div class="space-y-1">
        <label class="text-xs text-gray-400 font-medium">Video Quality</label>
        <select id="qualitySelect" class="w-full bg-gray-800 text-sm text-white px-3 py-2.5 rounded-xl border border-gray-700 outline-none">
          <option value="original">Original Quality (1080p Full HD)</option>
          <option value="720p" selected>Medium Quality (720p HD - Recommended)</option>
          <option value="480p">Compressed (480p - Fast WhatsApp Share)</option>
        </select>
      </div>

      <!-- Progress Bar -->
      <div id="progressBox" class="hidden space-y-1.5 bg-gray-950 p-3 rounded-xl border border-gray-800">
        <div class="flex justify-between text-xs">
          <span id="statusText" class="text-amber-400">Preparing...</span>
          <span id="percentText" class="text-gray-400 font-mono">0%</span>
        </div>
        <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
          <div id="progressBar" class="bg-emerald-500 h-full w-0 transition-all duration-200"></div>
        </div>
      </div>

      <!-- Generate Button -->
      <button id="generateBtn" onclick="generateFinalVideo()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow transition text-sm">
        Create Video
      </button>

      <!-- Download & Native Share Buttons (Shown after video is created) -->
      <div id="postExportActions" class="hidden grid grid-cols-2 gap-3 pt-1">
        <button onclick="downloadGeneratedVideo()" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 text-white font-semibold py-3 rounded-xl text-sm flex items-center justify-center gap-2">
          ⬇️ Download
        </button>
        <button onclick="shareGeneratedVideo()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl text-sm flex items-center justify-center gap-2">
          📤 Share App
        </button>
      </div>
    </div>
  </div>

  <script>
    // IndexedDB Setup
    const db = new Dexie("InspectionCamDB");
    db.version(1).stores({ clips: "++id, type, createdAt" });

    let mediaStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isRecording = false;
    let currentMode = "video"; // 'video' or 'photo'
    let timerInterval = null;
    let secondsElapsed = 0;

    let finalVideoBlob = null;
    let finalFileName = "Inspection_Report.mp4";

    // 1. Start Camera ONLY when user clicks "Open Camera"
    async function startCamera() {
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: true
        });
        const videoEl = document.getElementById("cameraPreview");
        videoEl.srcObject = mediaStream;
        videoEl.classList.remove("hidden");

        document.getElementById("cameraPlaceholder").classList.add("hidden");
        document.getElementById("cameraControls").classList.remove("hidden");
        document.getElementById("stopCamBtn").classList.remove("hidden");
      } catch (err) {
        alert("Camera permission denied or unavailable. Please allow camera access.");
      }
    }

    function stopCamera() {
      if (isRecording) return alert("Pehle current video clip save karein!");
      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }
      document.getElementById("cameraPreview").classList.add("hidden");
      document.getElementById("cameraControls").classList.add("hidden");
      document.getElementById("stopCamBtn").classList.add("hidden");
      document.getElementById("cameraPlaceholder").classList.remove("hidden");
    }

    // 2. Switch between Video and Photo mode
    function switchMode(mode) {
      if (isRecording) return;
      currentMode = mode;

      const tabVideo = document.getElementById("tabVideo");
      const tabPhoto = document.getElementById("tabPhoto");
      const videoBtn = document.getElementById("videoActionBtn");
      const photoBtn = document.getElementById("photoActionBtn");

      if (mode === "video") {
        tabVideo.className = "px-4 py-1.5 rounded-full bg-blue-600 text-white transition";
        tabPhoto.className = "px-4 py-1.5 rounded-full text-gray-300 transition";
        videoBtn.classList.remove("hidden");
        photoBtn.classList.add("hidden");
      } else {
        tabPhoto.className = "px-4 py-1.5 rounded-full bg-blue-600 text-white transition";
        tabVideo.className = "px-4 py-1.5 rounded-full text-gray-300 transition";
        photoBtn.classList.remove("hidden");
        videoBtn.classList.add("hidden");
      }
    }

    // 3. Video Recording Start / Save
    function toggleVideoRecording() {
      const btn = document.getElementById("videoActionBtn");
      const badge = document.getElementById("recBadge");
      const switcher = document.getElementById("modeSwitcher");

      if (!isRecording) {
        recordedChunks = [];
        mediaRecorder = new MediaRecorder(mediaStream, { mimeType: "video/webm" });
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };

        mediaRecorder.onstop = async () => {
          const videoBlob = new Blob(recordedChunks, { type: "video/webm" });
          const thumbUrl = captureVideoFrame(240, 135, 0.6);
          await db.clips.add({ type: "video", blob: videoBlob, thumbUrl, createdAt: Date.now() });
          renderThumbnails();
        };

        mediaRecorder.start();
        isRecording = true;
        startTimer();

        btn.innerHTML = `<span class="w-3.5 h-3.5 bg-white rounded-sm"></span><span>Save Clip</span>`;
        btn.classList.replace("bg-red-600", "bg-emerald-600");
        badge.classList.remove("hidden");
        switcher.classList.add("opacity-40", "pointer-events-none");
      } else {
        mediaRecorder.stop();
        isRecording = false;
        stopTimer();

        btn.innerHTML = `<span class="w-3.5 h-3.5 rounded-full bg-white"></span><span>Start Rec</span>`;
        btn.classList.replace("bg-emerald-600", "bg-red-600");
        badge.classList.add("hidden");
        switcher.classList.remove("opacity-40", "pointer-events-none");
      }
    }

    // 4. Instant Photo Capture & Save
    async function capturePhoto() {
      const video = document.getElementById("cameraPreview");
      if (!video.videoWidth) return;

      // Flash feedback
      video.classList.add("opacity-50");
      setTimeout(() => video.classList.remove("opacity-50"), 120);

      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext("2d").drawImage(video, 0, 0);

      const thumbUrl = canvas.toDataURL("image/jpeg", 0.5);
      canvas.toBlob(async (blob) => {
        await db.clips.add({ type: "photo", blob, thumbUrl, createdAt: Date.now() });
        renderThumbnails();
      }, "image/jpeg", 0.95);
    }

    function captureVideoFrame(w, h, q) {
      const video = document.getElementById("cameraPreview");
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      canvas.getContext("2d").drawImage(video, 0, 0, w, h);
      return canvas.toDataURL("image/jpeg", q);
    }

    function startTimer() {
      secondsElapsed = 0;
      document.getElementById("recTimer").textContent = "00:00";
      timerInterval = setInterval(() => {
        secondsElapsed++;
        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, "0");
        const secs = String(secondsElapsed % 60).padStart(2, "0");
        document.getElementById("recTimer").textContent = `${mins}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    // 5. Render Thumbnail Strip
    async function renderThumbnails() {
      const clips = await db.clips.toArray();
      const container = document.getElementById("thumbnailList");
      document.getElementById("clipCountLabel").textContent = `Captured Items (${clips.length})`;

      if (clips.length === 0) {
        container.innerHTML = `<p class="text-gray-500 text-xs mx-auto">No clips or photos saved yet.</p>`;
        return;
      }

      container.innerHTML = clips.map((clip, idx) => `
        <div class="relative flex-shrink-0 w-20 h-16 rounded-xl overflow-hidden border border-gray-700 bg-black shadow">
          <img src="${clip.thumbUrl}" class="w-full h-full object-cover" />
          <span class="absolute bottom-1 left-1 text-[10px] font-semibold bg-black/75 px-1.5 py-0.5 rounded">
            ${clip.type === 'video' ? '🎥' : '📸'} #${idx + 1}
          </span>
          <button onclick="deleteClip(${clip.id})" class="absolute top-1 right-1 bg-red-600/90 text-white text-xs w-4 h-4 rounded-full flex items-center justify-center leading-none">×</button>
        </div>
      `).join("");
      container.scrollLeft = container.scrollWidth;
    }

    async function deleteClip(id) {
      await db.clips.delete(id);
      renderThumbnails();
    }

    async function clearAllClips() {
      if (isRecording) return alert("Pehle recording stop karein!");
      if (confirm("Saare saved videos aur photos delete karne hain?")) {
        await db.clips.clear();
        renderThumbnails();
      }
    }

    // 6. Export Modal Logic
    async function openExportModal() {
      if (isRecording) return alert("Pehle current recording save karein!");
      const clips = await db.clips.toArray();
      if (clips.length === 0) return alert("Export karne ke liye kam se kam 1 video ya photo capture karein!");

      const defaultName = `Inspection_${new Date().toISOString().slice(0, 10)}`;
      document.getElementById("fileNameInput").value = defaultName;
      document.getElementById("postExportActions").classList.add("hidden");
      document.getElementById("progressBox").classList.add("hidden");
      document.getElementById("generateBtn").classList.remove("hidden");
      document.getElementById("exportModal").classList.remove("hidden");
    }

    function closeExportModal() {
      document.getElementById("exportModal").classList.add("hidden");
    }

    // 7. Merge Clips & Photos into Final MP4
    async function generateFinalVideo() {
      const clips = await db.clips.toArray();
      const rawName = document.getElementById("fileNameInput").value.trim() || "Inspection_Video";
      finalFileName = rawName.replace(/[^a-zA-Z0-9_-]/g, "_") + ".mp4";

      const quality = document.getElementById("qualitySelect").value;
      const generateBtn = document.getElementById("generateBtn");
      const progressBox = document.getElementById("progressBox");
      const statusText = document.getElementById("statusText");
      const percentText = document.getElementById("percentText");
      const progressBar = document.getElementById("progressBar");

      generateBtn.disabled = true;
      generateBtn.textContent = "Processing...";
      progressBox.classList.remove("hidden");
      statusText.textContent = "Loading video engine...";

      try {
        const { FFmpeg } = FFmpegWASM;
        const { fetchFile, toBlobURL } = FFmpegUtil;
        const ffmpeg = new FFmpeg();

        ffmpeg.on("progress", ({ progress }) => {
          const pct = Math.min(100, Math.round(progress * 100));
          percentText.textContent = `${pct}%`;
          progressBar.style.width = `${pct}%`;
        });

        const baseURL = "https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd";
        await ffmpeg.load({
          coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, "text/javascript"),
          wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, "application/wasm"),
        });

        const scale = quality === "original"
          ? "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2"
          : quality === "720p"
          ? "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2"
          : "scale=854:480:force_original_aspect_ratio=decrease,pad=854:480:(ow-iw)/2:(oh-ih)/2";

        const crf = quality === "original" ? "18" : quality === "720p" ? "23" : "28";
        let listContent = "";

        for (let i = 0; i < clips.length; i++) {
          statusText.textContent = `Merging item ${i + 1} of ${clips.length}...`;
          const clip = clips[i];
          const outFile = `part_${i}.mp4`;

          if (clip.type === "photo") {
            await ffmpeg.writeFile(`in_${i}.jpg`, await fetchFile(clip.blob));
            await ffmpeg.exec([
              "-loop", "1", "-i", `in_${i}.jpg`,
              "-f", "lavfi", "-i", "anullsrc=channel_layout=stereo:sample_rate=44100",
              "-t", "3", "-vf", `${scale},fps=30,format=yuv420p`,
              "-c:v", "libx264", "-crf", crf, "-preset", "veryfast",
              "-c:a", "aac", "-shortest", outFile
            ]);
          } else {
            await ffmpeg.writeFile(`in_${i}.webm`, await fetchFile(clip.blob));
            await ffmpeg.exec([
              "-i", `in_${i}.webm`,
              "-vf", `${scale},fps=30,format=yuv420p`,
              "-c:v", "libx264", "-crf", crf, "-preset", "veryfast",
              "-c:a", "aac", "-ar", "44100", "-ac", "2", outFile
            ]);
          }
          listContent += `file '${outFile}'\n`;
        }

        statusText.textContent = "Finalizing MP4...";
        await ffmpeg.writeFile("list.txt", listContent);
        await ffmpeg.exec(["-f", "concat", "-safe", "0", "-i", "list.txt", "-c", "copy", "final_out.mp4"]);

        const data = await ffmpeg.readFile("final_out.mp4");
        finalVideoBlob = new Blob([data.buffer], { type: "video/mp4" });

        statusText.textContent = "✅ Video Ready!";
        percentText.textContent = "100%";
        progressBar.style.width = "100%";

        generateBtn.classList.add("hidden");
        document.getElementById("postExportActions").classList.remove("hidden");
      } catch (err) {
        console.error(err);
        statusText.textContent = "❌ Error generating video. Check Vercel COOP/COEP headers.";
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = "Create Video";
      }
    }

    // 8. Download File to Device
    function downloadGeneratedVideo() {
      if (!finalVideoBlob) return;
      const url = URL.createObjectURL(finalVideoBlob);
      const a = document.createElement("a");
      a.href = url;
      a.download = finalFileName;
      a.click();
    }

    // 9. Native Mobile Share Sheet (WhatsApp, Gmail, Drive, Telegram, etc.)
    async function shareGeneratedVideo() {
      if (!finalVideoBlob) return;
      const file = new File([finalVideoBlob], finalFileName, { type: "video/mp4" });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: finalFileName,
            text: "Inspection video report"
          });
        } catch (err) {
          if (err.name !== "AbortError") alert("Share failed. Please use Download button.");
        }
      } else {
        alert("Aapka browser direct file sharing support nahi karta. Kripya Download button ka use karein.");
      }
    }

    // Load saved thumbnails on startup (without starting camera)
    window.onload = () => {
      renderThumbnails();
    };
  </script>
</body>
</html>
